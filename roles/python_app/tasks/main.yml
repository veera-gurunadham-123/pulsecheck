---
- name: Install Python, pip, and venv tools
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true

- name: Create the application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    mode: '0755'

- name: Create a dedicated virtual environment for the app
  ansible.builtin.command:
    cmd: "python3 -m venv {{ app_dir }}/venv"
    creates: "{{ app_dir }}/venv/bin/activate"

- name: Install Flask, gunicorn, and psycopg2 into the virtual environment
  ansible.builtin.pip:
    name:
      - flask
      - gunicorn
      - psycopg2-binary
    virtualenv: "{{ app_dir }}/venv"

- name: Ship the application code
  copy:
    src: app.py
    dest: "{{ app_dir }}/app.py"
    mode: '0644'
  notify: restart pulsecheck app

- name: Deploy the systemd service, with the database connection templated in
  template:
    src: pulsecheck.service.j2
    dest: "/etc/systemd/system/{{ app_service_name }}.service"
    mode: '0644'
  notify: restart pulsecheck app

- name: Start gunicorn application
  shell: |
    pkill -f gunicorn >/dev/null 2>&1 || true
    cd {{ app_dir }}
    nohup {{ app_dir }}/venv/bin/gunicorn \
      --workers {{ gunicorn_workers }} \
      --bind 0.0.0.0:{{ app_port }} \
      app:app > /tmp/pulsecheck.log 2>&1 &
  args:
    executable: /bin/bash
  async: 30
  poll: 0
