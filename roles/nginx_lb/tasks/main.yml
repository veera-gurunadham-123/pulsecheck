---
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Generate a self-signed TLS certificate (idempotent - skips if already present)
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 365
      -newkey rsa:2048
      -keyout /etc/nginx/pulsecheck-selfsigned.key
      -out /etc/nginx/pulsecheck-selfsigned.crt
      -subj "/CN=pulsecheck.local"
    creates: /etc/nginx/pulsecheck-selfsigned.crt

- name: Remove the default site so it can't conflict with ours
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Deploy the load balancer config, with the app tier's real IPs templated in
  template:
    src: pulsecheck_lb.conf.j2
    dest: /etc/nginx/sites-available/pulsecheck.conf
    mode: '0644'
  notify: reload nginx

- name: Enable our site
  file:
    src: /etc/nginx/sites-available/pulsecheck.conf
    dest: /etc/nginx/sites-enabled/pulsecheck.conf
    state: link
  notify: reload nginx

- name: Ensure nginx is running and enabled
  service:
    name: nginx
    state: started
    enabled: true
